
[[exceptions]]
check = "CH006-primitive_obsession"
path = "src/mcp_mediawiki_crunchtools/__init__.py"
justification = "Port 8016 is a standard default for HTTP servers"
classification = "by_design"

# Lint suppression — test intentionally passes invalid args to verify rejection
[[exceptions]]
check = "EV001-lint_suppression"
path = "tests/test_validation.py"
justification = "type: ignore[call-arg] is required to test that Pydantic rejects extra fields"
classification = "by_design"

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "src/mcp_mediawiki_crunchtools/client.py"
justification = "get_client and get_config are both the four-line lazy-singleton accessor: check the module global, construct if None, return. The duplication is the idiom; hiding it behind a generic obscures which global is being initialised."
classification = "by_design"

[[exceptions]]
check = "EV013-hidden_env_config"
path = "src/mcp_mediawiki_crunchtools/config.py"
justification = "MEDIAWIKI_URL, MEDIAWIKI_USERNAME, MEDIAWIKI_PASSWORD, MEDIAWIKI_HTTP_USER, and MEDIAWIKI_HTTP_PASS are real, intentional, user-facing settings -- confirmed against config.py's Config.__init__ (URL required and validated for scheme/host; username/password and http_user/http_pass are each optional but interdependent pairs, enforced by ConfigurationError). All five are documented by name, required/optional status, and purpose in README.md and CLAUDE.md's Environment Variables tables. EV013 has no documentation detection of its own -- it only compares the var name against a fixed allowlist -- so this exception is the record that a human confirmed each is real and written down."
classification = "by_design"

[[exceptions]]
check = "EV013-hidden_env_config"
path = "src/mcp_mediawiki_crunchtools/errors.py"
justification = "MediaWikiApiError re-reads MEDIAWIKI_PASSWORD and MEDIAWIKI_HTTP_PASS (the same variables documented in config.py's exception, see README.md/CLAUDE.md Environment Variables tables) to scrub any credential value out of an error message before it reaches an MCP client. Same documented variables, different read site."
classification = "by_design"

[[exceptions]]
check = "EV013-hidden_env_config"
path = "tests/test_tools.py"
justification = "Tests set/read the same already-documented MEDIAWIKI_URL, MEDIAWIKI_USERNAME, MEDIAWIKI_PASSWORD, MEDIAWIKI_HTTP_USER, and MEDIAWIKI_HTTP_PASS (see the config.py exception above and README.md/CLAUDE.md) to exercise Config and the error-sanitization path under test; these are not separate undocumented test-only toggles."
classification = "by_design"

[[exceptions]]
check = "EV002-manifest_lint_suppression"
path = "pyproject.toml"
justification = "Each remaining global ruff ignore was verified against this codebase with the project's own pinned toolchain (`uv run ruff check --select <RULE>`, ignore list temporarily cleared to get an unmasked read) before being kept: TRY003 (6 src/ files, MediaWiki API error messages), PLR2004 (models.py, MediaWiki-specific size/count limits), PLW0603 (client.py + config.py, module-level lazy singletons), TID252 (7 src/ files, this package's own internal relative imports). Two previously-global entries with zero hits anywhere (PLR0913) or that were fixable outright were resolved instead of excepted: PLR0913 had zero hits and was dropped; PIE790 (5 redundant `pass` statements in errors.py exception classes) and RUF022 (one unsorted `__all__` in tools/__init__.py) were fixed with `ruff check --fix` rather than kept ignored. S101 (assert), S105 (a literal secret value in a test fixture), and PLC0415 (importing the module under test inside the test body, plus a fixture helper in conftest.py) were moved from the global ignore into `[tool.ruff.lint.per-file-ignores]` for tests/* -- all three fire only in tests/, never in src/."
classification = "by_design"
